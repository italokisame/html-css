<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cad.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Meios de contato</legend>
            <P>
                <label for="iemail">Email:</label> <input type="email" name="email" id="iemail" placeholder="Digite seu email" required>
            </P>
            <p>
                <label for="itel">Telefone:</label> <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required placeholder="(00)00000-0000">
            </p>
            <p>
                <input type="submit" value="enviar">
                <input type="reset" value="limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
